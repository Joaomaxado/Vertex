spring.application.name=vertex-backend
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/vertex;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

google.cloud.project-id=${GOOGLE_CLOUD_PROJECT:}
google.cloud.location=${GOOGLE_CLOUD_LOCATION:us-central1}
google.cloud.vertex-model=${VERTEX_AI_MODEL:gemini-2.5-flash}